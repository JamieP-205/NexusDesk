<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">NexusDesk interface wireframes</title><desc id="desc">Three simple layouts for a ticket queue, a ticket detail page and an equipment register.</desc><rect width="1440" height="440" fill="#f3f5f4"/>
