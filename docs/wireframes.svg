<rect x="20" y="176" width="390" height="45" rx="4" fill="#f1f4f0" stroke="#cad4c9"/><text x="30" y="203.5" font-family="Arial,sans-serif" font-size="13" fill="#3f5347">Wi-Fi disconnects</text>
<rect x="20" y="230" width="390" height="45" rx="4" fill="#f1f4f0" stroke="#cad4c9"/><text x="30" y="257.5" font-family="Arial,sans-serif" font-size="13" fill="#3f5347">New account request</text>
<rect x="20" y="284" width="390" height="45" rx="4" fill="#f1f4f0" stroke="#cad4c9"/><text x="30" y="311.5" font-family="Arial,sans-serif" font-size="13" fill="#3f5347">Printer marks pages</text>
</g>
<g transform="translate(500,35)"><rect width="440" height="370" rx="8" fill="white" stroke="#bbc8bf"/><text x="20" y="35" font-family="Arial,sans-serif" font-size="20" fill="#172d28">Ticket details</text>
<rect x="20" y="70" width="250" height="55" rx="4" fill="#f1f4f0" stroke="#cad4c9"/><text x="30" y="102.5" font-family="Arial,sans-serif" font-size="13" fill="#3f5347">Problem description</text>
<rect x="285" y="70" width="125" height="55" rx="4" fill="#f1f4f0" stroke="#cad4c9"/><text x="295" y="102.5" font-family="Arial,sans-serif" font-size="13" fill="#3f5347">Status + priority</text>
<rect x="20" y="140" width="250" height="90" rx="4" fill="#f1f4f0" stroke="#cad4c9"/><text x="30" y="190.0" font-family="Arial,sans-serif" font-size="13" fill="#3f5347">Conversation</text>
<rect x="285" y="140" width="125" height="90" rx="4" fill="#f1f4f0" stroke="#cad4c9"/><text x="295" y="190.0" font-family="Arial,sans-serif" font-size="13" fill="#3f5347">Technician + save</text>
