name: Java checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw --batch-mode verify
      - run: python3 scripts/smoke_test.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: target/surefire-reports/

  demo-image:
    # Builds the image Render runs and starts it, so a Dockerfile that can't build never reaches Render.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file deploy/render/Dockerfile --tag nexusdesk-demo .
      - name: The class-data-sharing archive can be used
        # -Xshare:on makes Java stop instead of carrying on without the archive.
        run: |
          docker run --rm nexusdesk-demo java -Xshare:on -XX:SharedArchiveFile=/app/app.jsa \
            -Dspring.context.exit=onRefresh -jar /app/nexusdesk.jar --spring.profiles.active=hosted
      - name: The demo starts and serves its sign-in page
        run: |
          docker run --detach --name demo --publish 8080:8080 --env PORT=8080 nexusdesk-demo
          for i in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:8080/login; then echo "Up after about $((i * 2)) s"; exit 0; fi
            sleep 2
          done
          docker logs demo
          exit 1

  deploy-demo:
    # Redeploys the public browser demo on Render once the checks above pass on main.
    # Render can't watch this repo itself, so this asks it to deploy the commit that was just tested.
    needs: [test, demo-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: render-deploy
      cancel-in-progress: true
    steps:
      - name: Ask Render to deploy this commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-dbm62rt9fdbs73bv2a20
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$GITHUB_SHA\"}" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" > deploy.json || { cat deploy.json; exit 1; }
          python3 -c "import json; d = json.load(open('deploy.json')); print('Render deploy', d['id'], d['status'], 'for', d['commit']['id'][:7])"
