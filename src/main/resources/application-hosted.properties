# Public browser demo. Every visitor gets a private in-memory sandbox (see HostedConfig).
# Nothing is stored on disk, so a restart simply starts everyone afresh.
server.address=${NEXUSDESK_HOST:0.0.0.0}
server.port=${PORT:7860}
spring.datasource.url=jdbc:h2:mem:lobby;DB_CLOSE_DELAY=-1
# HTTPS ends at the hosting proxy. Relative redirects keep visitors on whichever address they used.
server.tomcat.use-relative-redirects=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=60m
server.tomcat.max-http-form-post-size=64KB
server.tomcat.threads.max=50
nexusdesk.hosted.idle=60m
nexusdesk.hosted.max-age=4h
nexusdesk.hosted.max-sandboxes=100
nexusdesk.hosted.creations-per-minute=60
nexusdesk.hosted.max-tickets=150
nexusdesk.hosted.max-comments=400
nexusdesk.hosted.max-users=40
nexusdesk.hosted.max-assets=60
# Total rows across tickets, comments, history, accounts, equipment and assignments.
nexusdesk.hosted.max-rows=2500
# How many X-Forwarded-For entries from the right were added by trusted proxies. 0 turns the
# per-visitor limits off; set it only after checking the host's proxy chain.
nexusdesk.hosted.trusted-proxy-hops=0
