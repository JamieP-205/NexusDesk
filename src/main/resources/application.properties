spring.application.name=NexusDesk
server.address=${NEXUSDESK_HOST:127.0.0.1}
server.port=${PORT:8080}
# WRITE_DELAY=0 makes H2 write each commit to disk straight away, so a crash or a forced stop
# can't lose the last half-second of saved work.
spring.datasource.url=${NEXUSDESK_DB_URL:jdbc:h2:file:./data/nexusdesk;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
spring.datasource.username=sa
spring.datasource.password=${NEXUSDESK_DB_PASSWORD:}
spring.flyway.enabled=true
spring.h2.console.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NEXUSDESK_SECURE_COOKIE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.shutdown=graceful
spring.servlet.multipart.enabled=false
# Sign-in throttling (see LoginThrottle). Failures are counted per email+address and per address.
nexusdesk.login.max-failures-per-account=5
nexusdesk.login.max-failures-per-address=20
nexusdesk.login.window=15m
nexusdesk.tickets.page-size=20
# The app deliberately supplies its own AuthenticationProvider (with throttling), so Spring's
# notice that the UserDetailsService bean isn't used directly is expected.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
