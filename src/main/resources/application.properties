spring.application.name=NexusDesk
server.address=${NEXUSDESK_HOST:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${NEXUSDESK_DB_URL:jdbc:h2:file:./data/nexusdesk;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=${NEXUSDESK_DB_PASSWORD:}
spring.flyway.enabled=true
spring.h2.console.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NEXUSDESK_SECURE_COOKIE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.enabled=false
