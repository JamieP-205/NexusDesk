<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit account')}"></head><body><aside th:replace="~{fragments :: nav('users')}"></aside><main class="main"><div class="topline"><a href="/users">← People</a></div><header class="page-header"><div><p class="eyebrow">ACCOUNT SETTINGS</p><h1 th:text="${person.name}"></h1></div></header><form class="panel form-panel" th:action="@{/users/{id}(id=${person.id})}" method="post"><label>Name<input name="name" required maxlength="100" th:value="${person.name}"></label><label>Email<input name="email" type="email" required maxlength="160" th:value="${person.email}"></label><label>Role<select name="role"><option th:each="r : ${ {'EMPLOYEE','TECHNICIAN','ADMIN'} }" th:value="${r}" th:text="${r}" th:selected="${r == person.role}"></option></select></label><label class="check"><input type="checkbox" name="enabled" value="true" th:checked="${person.enabled}">Account enabled</label><p class="help">Reassign active tickets before disabling IT staff. A disabled person is signed out on their next request; their old records stay in place.</p><div class="actions"><button class="primary" type="submit">Save account</button><a href="/users">Cancel</a></div></form></main></body></html>
