<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('New ticket')}"></head>
  <body>
    <aside th:replace="~{fragments :: sidebar('tickets')}"></aside>
    <main class="main" id="main">
      <div class="topline"><a href="/tickets">← Support tickets</a></div>
      <header class="page-header">
        <div>
          <p class="eyebrow">NEW REQUEST</p>
          <h1>What needs a hand?</h1>
          <p class="muted">
            A few details now can save a lot of back and forth.
          </p>
        </div>
      </header>
      <div th:replace="~{fragments :: notice}"></div>
      <form class="panel form-panel" th:action="@{/tickets}" method="post">
        <label
          >Title<input
            id="title"
            name="title"
            required
            maxlength="140"
            th:value="${form['title']}"
            placeholder="e.g. Laptop keeps losing Wi-Fi"
            th:aria-invalid="${errors['title'] != null} ? 'true'"
            th:aria-describedby="${errors['title'] != null} ? 'title-error'"
          /><span th:replace="~{fragments :: fieldError('title')}"></span
        ></label>
        <div class="form-grid">
          <label
            >Category<select id="category" name="category" required
              th:aria-invalid="${errors['category'] != null} ? 'true'"
              th:aria-describedby="${errors['category'] != null} ? 'category-error'">
              <option
                th:each="c : ${categories}"
                th:text="${c}"
                th:selected="${c == form['category']}"
              ></option></select
            ><span th:replace="~{fragments :: fieldError('category')}"></span
          ></label>
          <label
            >Priority<select id="priority" name="priority" required
              th:aria-invalid="${errors['priority'] != null} ? 'true'"
              th:aria-describedby="${errors['priority'] != null} ? 'priority-error'">
              <option
                th:each="p : ${priorities}"
                th:text="${p}"
                th:selected="${p == form['priority']}"
              ></option></select
            ><span th:replace="~{fragments :: fieldError('priority')}"></span
          ></label>
        </div>
        <p class="help">
          Critical means work has stopped for multiple people. High means you
          cannot do an important task.
        </p>
        <label
          >What happened?<textarea
            id="description"
            name="description"
            required
            maxlength="6000"
            rows="8"
            th:text="${form['description']}"
            th:aria-invalid="${errors['description'] != null} ? 'true'"
            th:aria-describedby="${errors['description'] != null} ? 'description-error'"
            placeholder="What were you trying to do? Include any error message and what you've already tried."
          ></textarea
          ><span th:replace="~{fragments :: fieldError('description')}"></span>
        </label>
        <p class="help">
          Don't include passwords or other sensitive information.
        </p>
        <div class="actions">
          <button class="primary" type="submit">Create ticket</button
          ><a href="/tickets">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
