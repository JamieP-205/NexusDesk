<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('People')}"></head>
  <body>
    <aside th:replace="~{fragments :: nav('users')}"></aside>
    <main class="main">
      <div class="topline">
        <span>WORKSPACE / PEOPLE</span><span>Administrator</span>
      </div>
      <header class="page-header">
        <div>
          <p class="eyebrow">ACCESS &amp; ACCOUNTS</p>
          <h1>People</h1>
          <p class="muted">Give each person the access they need.</p>
        </div>
      </header>
      <div th:replace="~{fragments :: notice}"></div>
      <section class="panel">
        <div class="section-heading">
          <h2>Team directory</h2>
          <span
            class="badge"
            th:text="${#lists.size(people) + ' accounts'}"
          ></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Person</th>
                <th>Role</th>
                <th>Access</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${people}">
                <td>
                  <strong th:text="${p.name}"></strong
                  ><small th:text="${p.email}"></small>
                </td>
                <td th:text="${p.role}"></td>
                <td th:text="${p.enabled ? 'Enabled' : 'Disabled'}"></td>
                <td>
                  <a
                    th:href="@{/users/{id}(id=${p.id})}"
                    th:aria-label="${'Edit ' + p.name}"
                    >Edit →</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel padded space-top">
        <h2>Create an account</h2>
        <form th:action="@{/users}" method="post">
          <div class="form-grid">
            <label
              >Name<input
                name="name"
                required
                maxlength="100"
                autocomplete="off" /></label
            ><label
              >Email<input
                type="email"
                name="email"
                required
                maxlength="160"
                autocomplete="off" /></label
            ><label
              >Role<select name="role">
                <option value="EMPLOYEE">Employee</option>
                <option value="TECHNICIAN">IT technician</option>
                <option value="ADMIN">Administrator</option>
              </select></label
            ><label
              >Password<input
                name="password"
                type="password"
                required
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
            /></label>
          </div>
          <p class="help">
            Use 12–128 characters and share the password securely. Password
            reset isn't available in this version.
          </p>
          <button class="primary" type="submit">Create account</button>
        </form>
      </section>
    </main>
  </body>
</html>
