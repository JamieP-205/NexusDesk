# Settings for running behind an HTTPS reverse proxy on the same machine (see docs/deployment.md).
# Keep NEXUSDESK_HOST at 127.0.0.1 so only the proxy can reach the app.
server.servlet.session.cookie.secure=true
# Trust X-Forwarded-For/Proto only from a proxy on a private or loopback address, so the app sees
# the visitor's real address (for sign-in throttling) and knows the request arrived over HTTPS.
server.forward-headers-strategy=native
server.tomcat.redirect-context-root=false
logging.level.org.springframework.security=WARN
